<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins ECR Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: #ffffff;
            width: 90%;
            max-width: 600px;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .success {
            margin-top: 25px;
            padding: 15px;
            background: #e8f8ee;
            color: #1e8449;
            border: 1px solid #b7e4c7;
            border-radius: 10px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">🚀</div>

        <h1>Hello from Jenkins!</h1>

        <p>
            Docker image successfully pushed to
            <strong>Amazon ECR</strong>.
        </p>

        <div class="success">
            ✅ Deployment Successful
        </div>

        <div class="footer">
            Jenkins • Docker • Amazon ECR
        </div>
    </div>

</body>
</html>
